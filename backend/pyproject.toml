[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "geoalchemy2>=0.20.0",
    "geopandas>=1.2.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.5",
]

[dependency-groups]
dev = [
    "ipython>=9.17.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI reads these markers at request time, so a call in the default is intended
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
