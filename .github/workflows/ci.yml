name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.13"
          enable-cache: true
      # Only the dev group: ruff doesn't need geopandas and friends
      - run: uv sync --locked --only-dev
      - run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: urban_data
    services:
      db:
        image: imresamu/postgis:17-3.5
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: urban_data
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d urban_data"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Compose fills ${POSTGRES_*} from .env; the example values are enough to build
      - run: cp .env.example .env
      - run: docker compose build
